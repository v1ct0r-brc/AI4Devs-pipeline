name: Deploy to EC2

"on":
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_INSTANCE }}
          username: ${{ secrets.AWS_ACCESS_ID }}
          key: ${{ secrets.AWS_ACCESS_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            APP_DIR="$HOME/lti"

            # 1. Ir al proyecto (debe estar clonado previamente en la EC2)
            cd "$APP_DIR" || { echo "No existe $APP_DIR. Clona el repo primero."; exit 1; }

            echo "Pulling latest changes..."
            git pull origin main

            # 2. Levantar PostgreSQL con Docker
            echo "Starting PostgreSQL with Docker Compose..."
            if [ ! -f .env ]; then
              echo "Falta el archivo .env en la raiz del proyecto (DB_USER, DB_PASSWORD, DB_NAME, DB_PORT)."
              exit 1
            fi
            docker compose up -d

            echo "Waiting for PostgreSQL..."
            for i in $(seq 1 30); do
              if docker compose exec -T db pg_isready -U "$(grep '^DB_USER=' .env | cut -d= -f2 | tr -d '"')" > /dev/null 2>&1; then
                echo "PostgreSQL is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "PostgreSQL did not become ready in time"
                exit 1
              fi
              sleep 2
            done

            # 3. Backend: deps, Prisma, migraciones, build
            echo "Installing backend dependencies..."
            cd backend
            npm ci

            echo "Generating Prisma client..."
            npx prisma generate

            echo "Applying database migrations..."
            npx prisma migrate deploy

            echo "Building backend..."
            npm run build

            # 4. Frontend: deps y build
            echo "Installing frontend dependencies..."
            cd ../frontend
            npm ci

            echo "Building frontend..."
            npm run build

            # 5. Reiniciar backend con PM2
            cd ../backend
            echo "Restarting backend with PM2..."
            if pm2 describe lti-backend > /dev/null 2>&1; then
              pm2 restart lti-backend
            else
              pm2 start dist/index.js --name lti-backend
            fi
            pm2 save

            echo "Deploy completado correctamente"
