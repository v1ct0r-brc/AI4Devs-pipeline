name: Deploy to EC2

# Se ejecuta cada vez que hay un push a la rama main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Conectarse por SSH a la EC2 y ejecutar los comandos de deploy
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_INSTANCE }}
          username: ${{ secrets.AWS_ACCESS_ID }}
          key: ${{ secrets.AWS_ACCESS_KEY }}
          port: 22
          script_stop: true  # Detener el deploy si algún comando falla
          script: |
            # ---------------------------------------------------------
            # 1. Navegar al directorio del proyecto en la EC2
            #    ⚠️ AJUSTA ESTA RUTA según donde tengas clonado el repo
            # ---------------------------------------------------------
            cd /home/ec2-user/lti || exit 1

            # ---------------------------------------------------------
            # 2. Descargar los últimos cambios del repositorio
            # ---------------------------------------------------------
            echo "📥 Pulling latest changes..."
            git pull origin main

            # ---------------------------------------------------------
            # 3. Backend: instalar dependencias, generar Prisma y build
            # ---------------------------------------------------------
            echo "🔧 Installing backend dependencies..."
            cd backend
            npm install --production=false

            echo "🗄️ Generating Prisma client..."
            npx prisma generate

            echo "🏗️ Building backend..."
            npm run build

            # ---------------------------------------------------------
            # 4. Frontend: instalar dependencias y build de producción
            # ---------------------------------------------------------
            echo "🎨 Installing frontend dependencies..."
            cd ../frontend
            npm install

            echo "🏗️ Building frontend..."
            npm run build

            # ---------------------------------------------------------
            # 5. Reiniciar la aplicación con PM2
            # ---------------------------------------------------------
            cd ../backend
            echo "🔄 Restarting backend with PM2..."
            # Si el proceso ya existe, lo reinicia; si no, lo inicia
            pm2 describe lti-backend > /dev/null 2>&1 \
              && pm2 restart lti-backend \
              || pm2 start dist/index.js --name lti-backend

            # Guardar el estado de PM2 para que persista tras reinicios
            pm2 save

            echo "✅ Deploy completado correctamente"