# .github/workflows/deploy.yml
name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Build Backend
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          npm test -- --passWithNoTests

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_INSTANCE }}
          username: ${{ secrets.AWS_ACCESS_ID }}
          key: ${{ secrets.AWS_ACCESS_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            APP_DIR="$HOME/AI4Devs-pipeline"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository into $APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cd backend
            npm ci
            npx prisma generate
            npm run build
            if pm2 describe pipeline-backend > /dev/null 2>&1; then
              pm2 restart pipeline-backend
            else
              pm2 start dist/index.js --name pipeline-backend
            fi
            pm2 save

            cd ../frontend
            npm ci
            npm run build
